<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4fc"><title>Rewa — small wins, at random</title>
<style>
:root{--purple:#7654d8;--deep:#5536b5;--ink:#211d2d;--muted:#898395;--line:#eeeaf4;--bg:#f7f5fa;--card:#fff;--green:#27865f;--red:#c64c68}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.shell{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 20px calc(28px + env(safe-area-inset-bottom));}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 22px}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:750;letter-spacing:-.5px}.logo{width:34px;height:34px;background:linear-gradient(145deg,#a789f4,#6845cf);border-radius:12px;display:grid;place-items:center;color:white;font-size:20px;box-shadow:0 5px 12px #7654d833}.lang{border:1px solid var(--line);border-radius:20px;background:#fff;padding:8px 12px;color:#5d566c;font-weight:650;font-size:12px}.eyebrow{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}.hello{font-size:28px;letter-spacing:-1px;margin:6px 0 17px;font-weight:760}.score-card{background:linear-gradient(125deg,#7654d8,#6140c3);border-radius:24px;padding:20px;color:#fff;box-shadow:0 12px 28px #6845cf2b;position:relative;overflow:hidden}.score-card:after{content:"✳";position:absolute;right:17px;top:4px;font-size:100px;color:#ffffff12}.score-label{font-size:13px;color:#e4dcff}.score-line{display:flex;justify-content:space-between;align-items:flex-end;margin-top:7px}.score{font-size:42px;line-height:1;font-weight:760;letter-spacing:-2px}.score small{font-size:14px;letter-spacing:0;font-weight:600;color:#e2d8ff}.period{display:flex;gap:6px;margin-top:18px;position:relative;z-index:1}.period button{border:0;border-radius:14px;padding:7px 11px;background:#ffffff20;color:#eee8ff;font-size:12px;font-weight:650}.period button.active{background:white;color:var(--deep)}.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 1px 12px}.section-head h2{font-size:17px;margin:0;letter-spacing:-.3px}.text-btn{background:none;border:0;color:var(--purple);font-size:13px;font-weight:700;padding:8px 0}.activity-list{display:flex;flex-direction:column;gap:10px}.activity{background:var(--card);border:1px solid #f0edf4;border-radius:17px;padding:13px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px #291a0906}.activity-icon{width:42px;height:42px;background:#f2edff;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}.activity-info{flex:1;min-width:0}.activity-name{font-size:14px;font-weight:700}.activity-meta{font-size:11px;color:var(--muted);margin-top:4px}.start{border:0;background:#f1edfb;color:var(--deep);border-radius:12px;padding:9px 12px;font-size:12px;font-weight:730}.start.running{background:var(--deep);color:white}.row-actions{display:flex;gap:5px;align-items:center}.tiny{border:0;background:transparent;color:#a6a1b0;padding:7px;font-size:15px}.neg-card{background:#fff;border:1px solid #f0edf4;border-radius:17px;padding:14px;display:flex;align-items:center;gap:12px}.neg-icon{background:#fff0f2}.neg-card .activity-meta{margin-top:3px}.neg-btn{border:1px solid #f1dce1;background:#fff8f9;color:var(--red);padding:9px 11px;border-radius:12px;font-weight:700;font-size:12px}.history{display:flex;flex-direction:column}.event{padding:12px 2px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}.event:last-child{border:0}.event-icon{font-size:17px;width:24px;text-align:center}.event-copy{flex:1}.event-title{font-size:13px;font-weight:650}.event-date{font-size:11px;color:var(--muted);margin-top:3px}.points{font-size:14px;font-weight:750;color:var(--green)}.points.negative{color:var(--red)}.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 0}.footnote{text-align:center;color:#aaa5b3;font-size:11px;margin:20px 10px 0}.modal-back{position:fixed;inset:0;background:#1d153255;display:none;align-items:flex-end;justify-content:center;z-index:4;padding:12px}.modal-back.show{display:flex}.modal{width:min(100%,520px);background:white;border-radius:24px;padding:20px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 20px 60px #22134233}.modal-head{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:750;margin-bottom:15px}.close{border:0;background:#f5f3f8;border-radius:50%;width:31px;height:31px;font-size:17px;color:#726b7c}.field{margin:13px 0}.field label{display:block;font-size:12px;color:#797386;font-weight:650;margin-bottom:7px}.field input{width:100%;border:1px solid #e9e5ef;border-radius:12px;padding:13px;font:inherit;font-size:14px;outline:0}.field input:focus{border-color:#9c82e8}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{width:100%;border:0;border-radius:14px;background:var(--purple);color:white;padding:14px;font-size:14px;font-weight:750;margin-top:10px}.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,15px);opacity:0;background:#272133;color:white;padding:12px 16px;border-radius:14px;font-size:14px;pointer-events:none;transition:.22s;z-index:8;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:600px){.shell{padding-top:28px}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="logo">✳</div>rewa</div><button class="lang" id="lang"></button></header><div class="eyebrow" id="today"></div><div class="hello" id="hello"></div><section class="score-card"><div class="score-label" id="totalLabel"></div><div class="score-line"><div class="score" id="total">0 <small>pts</small></div><div id="eventCount" class="score-label"></div></div><nav class="period" id="period"></nav></section><div class="section-head"><h2 id="workTitle"></h2><button class="text-btn" id="add"></button></div><div class="activity-list" id="activities"></div><div class="section-head"><h2 id="negativeTitle"></h2><button class="text-btn" id="addNeg"></button></div><div id="negatives"></div><div class="section-head"><h2 id="historyTitle"></h2></div><div class="history" id="history"></div><div class="footnote" id="foot"></div></main><div class="modal-back" id="modalBack"><section class="modal"><div class="modal-head"><span id="modalTitle"></span><button class="close" id="close">×</button></div><div id="modalBody"></div><button class="save" id="save"></button></section></div><div class="toast" id="toast"></div>
<script>
const T={en:{today:'YOUR LITTLE WINS',hello:'A little progress counts.',month:'Month',year:'Year',all:'All time',total:'POINTS EARNED',events:n=>`${n} moments`,work:'Your work sections',add:'+ Add',start:'Start',finish:'Finish',starting:'In progress',begin:'Start',completed:'Completed',negative:'Gentle nudges',addNeg:'+ Add event',log:'Log',history:'Recent moments',empty:'Nothing here yet. Every beginning counts.',foot:'Points reward showing up, never the outcome.',name:'Name',icon:'Emoji',startRange:'Start points (min–max)',finishRange:'Finish points (min–max)',min:'Min',max:'Max',save:'Save',newWork:'New work section',editWork:'Edit work section',newNeg:'New negative event',editNeg:'Edit negative event',negativeRange:'Penalty points (min–max)',mustName:'Add a name first',started:'You showed up! +',finished:'Nicely done! +',penalty:'Logged: ',delete:'Delete this section?',choose:'Choose an event',negativePlaceholder:'e.g. Stayed up too late',date:d=>new Intl.DateTimeFormat('en',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(d)),period:p=>p==='month'?'This month':p==='year'?'This year':'All time'},zh:{today:'记录你的小小进步',hello:'每一点进步都值得。',month:'本月',year:'今年',all:'累计',total:'已获得积分',events:n=>`${n} 次记录`,work:'工作条目',add:'+ 新增',start:'开始',finish:'完成',starting:'进行中',begin:'开始',completed:'已完成',negative:'温柔提醒',addNeg:'+ 添加事件',log:'记录',history:'最近记录',empty:'还没有记录。每一次开始都值得。',foot:'积分奖励的是行动，而不是结果。',name:'名称',icon:'图标',startRange:'开始积分（最低–最高）',finishRange:'完成积分（最低–最高）',min:'最低',max:'最高',save:'保存',newWork:'新建工作条目',editWork:'编辑工作条目',newNeg:'新建负面事件',editNeg:'编辑负面事件',negativeRange:'扣分范围（最低–最高）',mustName:'请先填写名称',started:'你开始了！+',finished:'完成啦！+',penalty:'已记录：',delete:'删除此条目？',choose:'选择一个事件',negativePlaceholder:'例如：熬夜晚睡',date:d=>new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit',hour12:false}).format(new Date(d)),period:p=>p==='month'?'本月':p==='year'?'今年':'累计'}};
const icons=['📚','🏃','🧘','🌅','💻','🎨','💧','📝','🌙','✨'];let state=JSON.parse(localStorage.getItem('rewa-v1')||'null')||{lang:'zh',period:'month',items:[{id:'i1',name:{zh:'学习',en:'Study'},icon:'📚',start:[1,100],finish:[1,100]},{id:'i2',name:{zh:'锻炼',en:'Exercise'},icon:'🏃',start:[1,100],finish:[1,100]},{id:'i3',name:{zh:'冥想',en:'Meditation'},icon:'🧘',start:[1,100],finish:[1,100]},{id:'i4',name:{zh:'早睡早起',en:'Sleep routine'},icon:'🌅',start:[1,100],finish:[1,100]}],negatives:[{id:'n1',name:{zh:'熬夜晚睡',en:'Stayed up late'},icon:'🌙',range:[-100,-1]}],events:[]};let edit=null;const $=s=>document.querySelector(s),tr=()=>T[state.lang],persist=()=>localStorage.setItem('rewa-v1',JSON.stringify(state)),random=r=>Math.floor(Math.random()*(r[1]-r[0]+1))+r[0],nm=o=>typeof o.name==='string'?o.name:(o.name[state.lang]||o.name.en);function range(v){return Array.isArray(v)?v:[1,100]}function render(){let t=tr();document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';$('#lang').textContent=state.lang==='zh'?'EN':'中文';$('#today').textContent=new Intl.DateTimeFormat(state.lang==='zh'?'zh-CN':'en',{weekday:'long',month:'long',day:'numeric'}).format(new Date()).toUpperCase();$('#hello').textContent=t.hello;$('#totalLabel').textContent=`${t.total} · ${t.period(state.period)}`;$('#workTitle').textContent=t.work;$('#add').textContent=t.add;$('#negativeTitle').textContent=t.negative;$('#addNeg').textContent=t.addNeg;$('#historyTitle').textContent=t.history;$('#foot').textContent=t.foot;$('#period').innerHTML=['month','year','all'].map(p=>`<button data-p="${p}" class="${state.period===p?'active':''}">${t[p]}</button>`).join('');let events=state.events.filter(e=>{let d=new Date(e.date),n=new Date();return state.period==='all'||(state.period==='month'?d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth():d.getFullYear()===n.getFullYear())});let sum=events.reduce((a,e)=>a+e.points,0);$('#total').innerHTML=`${sum.toLocaleString()} <small>pts</small>`;$('#eventCount').textContent=t.events(events.length);$('#activities').innerHTML=state.items.length?state.items.map(i=>{let running=state.events.some(e=>e.itemId===i.id&&e.kind==='start'&&!e.completed);return `<div class="activity"><div class="activity-icon">${i.icon||'✨'}</div><div class="activity-info"><div class="activity-name">${esc(nm(i))}</div><div class="activity-meta">${t.start} +${range(i.start).join('–')} · ${t.finish} +${range(i.finish).join('–')}</div></div><button class="start ${running?'running':''}" data-action="${running?'finish':'start'}" data-id="${i.id}">${running?t.finish:t.start}</button><button class="tiny" data-edit="${i.id}">···</button></div>`}).join(''):`<div class="empty">${t.empty}</div>`;$('#negatives').innerHTML=state.negatives.length?state.negatives.map(n=>`<div class="neg-card"><div class="activity-icon neg-icon">${n.icon||'🌙'}</div><div class="activity-info"><div class="activity-name">${esc(nm(n))}</div><div class="activity-meta">${range(n.range).join('–')} pts</div></div><button class="neg-btn" data-penalty="${n.id}">${t.log}</button><button class="tiny" data-editneg="${n.id}">···</button></div>`).join(''):`<div class="empty">${t.empty}</div>`;$('#history').innerHTML=events.length?[...events].sort((a,b)=>b.date-a.date).slice(0,30).map(e=>`<div class="event"><div class="event-icon">${e.icon}</div><div class="event-copy"><div class="event-title">${esc(e.title)}</div><div class="event-date">${t.date(e.date)}</div></div><div class="points ${e.points<0?'negative':''}">${e.points>0?'+':''}${e.points}</div></div>`).join(''):`<div class="empty">${t.empty}</div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1700)}function record(ev){state.events.push(ev);persist();render()}
$('#lang').onclick=()=>{state.lang=state.lang==='zh'?'en':'zh';persist();render()};$('#period').onclick=e=>{if(e.target.dataset.p){state.period=e.target.dataset.p;persist();render()}};$('#add').onclick=()=>openForm('work');$('#addNeg').onclick=()=>openForm('neg');$('#close').onclick=closeForm;$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')closeForm()};function closeForm(){$('#modalBack').classList.remove('show');edit=null}function openForm(kind,id){edit={kind,id};const isNeg=kind==='neg',old=(isNeg?state.negatives:state.items).find(x=>x.id===id),t=tr();$('#modalTitle').textContent=old?(isNeg?t.editNeg:t.editWork):(isNeg?t.newNeg:t.newWork);let r=old?(isNeg?range(old.range):range(old.start)):(isNeg?[-100,-1]:[1,100]),f=old&&!isNeg?range(old.finish):[1,100];$('#modalBody').innerHTML=`<div class="field"><label>${t.name}</label><input id="fName" maxlength="36" placeholder="${isNeg?t.negativePlaceholder:(state.lang==='zh'?'例如：阅读':'e.g. Read')}" value="${old?esc(nm(old)):''}"></div><div class="field"><label>${t.icon}</label><input id="fIcon" maxlength="4" value="${old?.icon|| (isNeg?'🌙':'📚')}"></div><div class="field"><label>${isNeg?t.negativeRange:t.startRange}</label><div class="pair"><input id="fMin" type="number" value="${r[0]}" placeholder="${t.min}"><input id="fMax" type="number" value="${r[1]}" placeholder="${t.max}"></div></div>${isNeg?'':`<div class="field"><label>${t.finishRange}</label><div class="pair"><input id="cMin" type="number" value="${f[0]}"><input id="cMax" type="number" value="${f[1]}"></div></div>`}${old?`<button id="delete" class="text-btn">${t.delete}</button>`:''}`;$('#save').textContent=t.save;$('#modalBack').classList.add('show');}
$('#save').onclick=()=>{if(!edit)return;let {kind,id}=edit,isNeg=kind==='neg',name=$('#fName').value.trim(),icon=$('#fIcon').value.trim()||(isNeg?'🌙':'✨'),a=Number($('#fMin').value),b=Number($('#fMax').value),c=isNeg?0:Number($('#cMin').value),d=isNeg?0:Number($('#cMax').value);if(!name){toast(tr().mustName);return}if(![a,b].every(Number.isFinite)||(!isNeg&&![c,d].every(Number.isFinite)))return;let arr=isNeg?state.negatives:state.items,obj={id:id||crypto.randomUUID(),name:{...(typeof (arr.find(x=>x.id===id)?.name)==='object'?arr.find(x=>x.id===id).name:{}),[state.lang]:name},icon};if(isNeg)obj.range=[Math.min(a,b),Math.max(a,b)];else{obj.start=[Math.max(0,Math.min(a,b)),Math.max(0,Math.max(a,b))];obj.finish=[Math.max(0,Math.min(c,d)),Math.max(0,Math.max(c,d))]}if(id)arr[arr.findIndex(x=>x.id===id)]=obj;else arr.push(obj);persist();closeForm();render()};
$('#activities').onclick=e=>{let b=e.target.closest('[data-action]'),ed=e.target.closest('[data-edit]');if(ed){openForm('work',ed.dataset.edit);return}if(!b)return;let i=state.items.find(x=>x.id===b.dataset.id),t=tr();if(b.dataset.action==='start'){let p=random(range(i.start));record({itemId:i.id,kind:'start',completed:false,points:p,title:`${nm(i)} · ${t.started.replace('+','').trim()}`,icon:i.icon,date:Date.now()});toast(`${t.started}${p}`)}else{let p=random(range(i.finish));let ev=[...state.events].reverse().find(x=>x.itemId===i.id&&x.kind==='start'&&!x.completed);if(ev)ev.completed=true;record({itemId:i.id,kind:'finish',completed:true,points:p,title:`${nm(i)} · ${t.finished.replace('+','').trim()}`,icon:i.icon,date:Date.now()});toast(`${t.finished}${p}`)}};$('#negatives').onclick=e=>{let p=e.target.closest('[data-penalty]'),ed=e.target.closest('[data-editneg]');if(ed){openForm('neg',ed.dataset.editneg);return}if(!p)return;let n=state.negatives.find(x=>x.id===p.dataset.penalty),points=-Math.abs(random(range(n.range)));record({kind:'negative',points,title:nm(n),icon:n.icon,date:Date.now()});toast(`${tr().penalty}${points}`)};
// Delete is deliberately explicit inside editor.
document.addEventListener('click',e=>{if(e.target.id==='delete'&&edit){let t=tr(),arr=edit.kind==='neg'?state.negatives:state.items;if(confirm(t.delete)){arr.splice(arr.findIndex(x=>x.id===edit.id),1);persist();closeForm();render()}}});render();
</script></body></html>
